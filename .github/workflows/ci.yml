name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Test and package (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: windows-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            package: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: Test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test command-line entry point
        shell: bash
        run: target/${{ matrix.target }}/release/gbc-sprite-editor --help
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE: gbc-sprite-editor-${{ matrix.package }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist/$PACKAGE"
          cp "target/$BUILD_TARGET/release/gbc-sprite-editor" LICENSE README.md "dist/$PACKAGE/"
          cp -R examples "dist/$PACKAGE/"
          tar -czf "dist/$PACKAGE.tar.gz" -C dist "$PACKAGE"
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          PACKAGE: gbc-sprite-editor-${{ matrix.package }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          app="dist/$PACKAGE/GBC Sprite Editor.app"
          mkdir -p "$app/Contents/MacOS"
          cp "target/$BUILD_TARGET/release/gbc-sprite-editor" "$app/Contents/MacOS/"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>GBC Sprite Editor</string>
          <key>CFBundleDisplayName</key><string>GBC Sprite Editor</string>
          <key>CFBundleIdentifier</key><string>io.github.vulcandth.gbc-sprite-editor</string>
          <key>CFBundleExecutable</key><string>gbc-sprite-editor</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>$version</string>
          <key>CFBundleVersion</key><string>$version</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          cp LICENSE README.md "dist/$PACKAGE/"
          cp -R examples "dist/$PACKAGE/"
          ditto -c -k --sequesterRsrc --keepParent "dist/$PACKAGE" "dist/$PACKAGE.zip"
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE: gbc-sprite-editor-${{ matrix.package }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path "dist/$env:PACKAGE" -Force | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/release/gbc-sprite-editor.exe", LICENSE, README.md -Destination "dist/$env:PACKAGE/"
          Copy-Item examples -Destination "dist/$env:PACKAGE/" -Recurse
          Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
      - name: Upload downloadable archive
        uses: actions/upload-artifact@v7
        with:
          name: gbc-sprite-editor-${{ matrix.package }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
